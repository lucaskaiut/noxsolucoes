<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HabitaFlow — Protótipo navegável | Nox Soluções em Tecnologias</title>
<meta name="description" content="Protótipo navegável do HabitaFlow, plataforma SaaS modular para licenciamento e regularização de empreendimentos habitacionais, proposta pela Nox Soluções em Tecnologias." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f6f8fc; --surface: #ffffff; --surface-2: #eef2f8; --surface-3: #dce6f2;
  --fg: #0f172a; --muted: #5b6576; --subtle: #94a3b8;
  --primary: #7c3aed; --primary-hover: #6d28d9; --primary-soft: #f3eefe; --primary-fg: #ffffff;
  --danger: #dc2626; --danger-soft: #fef2f2; --success: #059669; --success-soft: #ecfdf5;
  --warning: #b45309; --warning-soft: #fffbeb; --info: #0369a1; --info-soft: #f0f9ff;
  --ring: rgb(124 58 237 / .45); --overlay: rgb(15 18 25 / .45);
  --shadow-card: 0 1px 2px rgb(16 24 40 / .05), 0 2px 8px rgb(16 24 40 / .04);
  --shadow-raised: 0 2px 4px rgb(16 24 40 / .05), 0 8px 20px rgb(16 24 40 / .08);
  --shadow-pop: 0 8px 16px -4px rgb(16 24 40 / .1), 0 20px 48px -8px rgb(16 24 40 / .18);
  --map-land: #eef2f8; --map-zone: #e3e9f3; --map-road: #ffffff; --map-water: #cfe3f7; --map-green: #dcefe2;
}
.dark {
  --bg: #0f0d17; --surface: #17151f; --surface-2: #221f2c; --surface-3: #2d2a38;
  --fg: #f2f1f6; --muted: #a39eb2; --subtle: #6f6a7e;
  --primary: #8b5cf6; --primary-hover: #a78bfa; --primary-soft: rgb(139 92 246 / .16); --primary-fg: #ffffff;
  --danger: #ef4444; --danger-soft: rgb(239 68 68 / .13); --success: #34d399; --success-soft: rgb(52 211 153 / .12);
  --warning: #fbbf24; --warning-soft: rgb(251 191 36 / .12); --info: #38bdf8; --info-soft: rgb(56 189 248 / .12);
  --ring: rgb(139 92 246 / .55); --overlay: rgb(0 0 0 / .6);
  --shadow-card: 0 1px 2px rgb(0 0 0 / .5); --shadow-raised: 0 2px 6px rgb(0 0 0 / .45), 0 10px 24px rgb(0 0 0 / .35);
  --shadow-pop: 0 12px 32px rgb(0 0 0 / .6);
  --map-land: #1b1925; --map-zone: #23202f; --map-road: #2f2b3c; --map-water: #1c2a3d; --map-green: #1c2b24;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
*:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--primary); color: var(--primary-fg); }
svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; } svg.i.lg { width: 22px; height: 22px; }

/* Banner do protótipo */
.proto-banner { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; background: #2e1065; color: #ede9fe; font-size: 12.5px; padding: 7px 16px; text-align: center; }
.proto-banner strong { color: #fff; font-weight: 600; }
.proto-banner a { color: #c4b5fd; text-decoration: underline; text-underline-offset: 2px; }

/* Layout */
.app { display: flex; flex: 1; min-height: 0; overflow: hidden; }
.sidebar { width: 256px; flex-shrink: 0; background: var(--surface); display: flex; flex-direction: column; box-shadow: var(--shadow-card); z-index: 20; }
.sidebar-head { padding: 20px 16px 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); }
.brand-name { font-size: 14px; font-weight: 600; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 22px; }
.nav-label { padding: 0 12px 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--subtle); text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
.nav-item .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--danger-soft); color: var(--danger); border-radius: 999px; padding: 1px 7px; }
.sidebar-foot { padding: 12px 16px 16px; border-top: 1px solid var(--surface-2); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.sidebar-foot img { height: 18px; width: auto; }
.sidebar-foot .logo-dark, .dark .sidebar-foot .logo-light { display: none; } .dark .sidebar-foot .logo-dark { display: inline; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: 60px; flex-shrink: 0; background: var(--bg); padding: 0 32px; }
.content { width: 100%; padding: 8px 40px 48px; }
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 40; display: none; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--bg); }
.menu-btn { display: none; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-card); color: var(--subtle); width: 300px; font-size: 13.5px; }
.search input { border: 0; outline: 0; background: transparent; width: 100%; }
.ml-auto { margin-left: auto; }
.user { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; }
.user-name { font-size: 13px; font-weight: 500; line-height: 1.2; } .user-role { font-size: 12px; color: var(--muted); }
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 600; width: 32px; height: 32px; font-size: 12px; flex-shrink: 0; }
.avatar.sm { width: 26px; height: 26px; font-size: 10.5px; }
.persona { display: flex; background: var(--surface-2); padding: 3px; border-radius: 10px; gap: 2px; }
.persona button { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.persona button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-raised); }
.persona-label { font-size: 12px; color: var(--subtle); white-space: nowrap; }

/* Page */
.page { display: flex; flex-direction: column; gap: 24px; animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
.page-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.page-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumb a:hover { color: var(--fg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.g-wf { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-card); min-width: 0; }
.card.hover { transition: box-shadow .15s; cursor: pointer; } .card.hover:hover { box-shadow: var(--shadow-raised); }
.card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 0; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; } .card-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.card-body { padding: 20px; }
.stat { display: flex; align-items: center; gap: 16px; }
.stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-label { font-size: 13px; color: var(--muted); } .stat-value { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
.stat-delta { font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
.soft-primary { background: var(--primary-soft); color: var(--primary); } .soft-success { background: var(--success-soft); color: var(--success); }
.soft-warning { background: var(--warning-soft); color: var(--warning); } .soft-danger { background: var(--danger-soft); color: var(--danger); }
.soft-info { background: var(--info-soft); color: var(--info); } .soft-neutral { background: var(--surface-2); color: var(--muted); }
.t-success { color: var(--success); } .t-danger { color: var(--danger); } .t-warning { color: var(--warning); } .t-muted { color: var(--muted); } .t-primary { color: var(--primary); }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.badge.plain::before { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 0; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; white-space: nowrap; user-select: none; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-card); } .btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: var(--surface-2); color: var(--fg); } .btn.secondary:hover { background: var(--surface-3); }
.btn.ghost { background: transparent; color: var(--muted); } .btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.success { background: var(--success); color: #fff; }
.btn[disabled] { opacity: .6; pointer-events: none; }
.seg { display: inline-flex; background: var(--surface-2); padding: 4px; border-radius: 12px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-raised); }
.seg button .n { font-size: 11.5px; color: var(--subtle); margin-left: 4px; }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead tr { background: color-mix(in srgb, var(--surface-2) 60%, transparent); text-align: left; font-size: 11.5px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
th { padding: 12px 20px; font-weight: 500; white-space: nowrap; }
td { padding: 13px 20px; vertical-align: middle; box-shadow: inset 0 1px 0 var(--surface-2); }
tbody tr { transition: background .12s; } tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
tr.click { cursor: pointer; }
.cell-title { font-weight: 500; } .cell-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 80px; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }

/* Charts */
.bars { display: flex; align-items: flex-end; gap: 14px; height: 190px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; min-width: 0; }
.bar { width: 100%; max-width: 46px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #a78bfa, #7c3aed); position: relative; transition: height .6s cubic-bezier(.22, 1, .36, 1); }
.bar span { position: absolute; top: -20px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--fg); }
.bar-label { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.25; height: 30px; }
.hbar { display: grid; grid-template-columns: 150px 1fr 54px; align-items: center; gap: 12px; font-size: 13px; padding: 7px 0; }
.hbar-track { height: 10px; background: var(--surface-2); border-radius: 999px; position: relative; }
.hbar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.hbar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); opacity: .55; border-radius: 2px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 13px 20px; box-shadow: inset 0 1px 0 var(--surface-2); }
.list-item:first-child { box-shadow: none; }
.li-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.li-title { font-size: 14px; font-weight: 500; } .li-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Stepper */
.stepper { display: flex; gap: 0; overflow-x: auto; padding: 4px 0; }
.step { flex: 1; min-width: 120px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; gap: 8px; }
.step::before { content: ''; position: absolute; top: 15px; left: calc(-50% + 18px); right: calc(50% + 18px); height: 2px; background: var(--surface-3); }
.step:first-child::before { display: none; }
.step.done::before, .step.current::before { background: var(--primary); }
.step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--subtle); font-size: 13px; font-weight: 600; z-index: 1; }
.step.done .step-dot { background: var(--primary); color: #fff; }
.step.current .step-dot { background: var(--surface); color: var(--primary); box-shadow: 0 0 0 2px var(--primary), 0 0 0 6px var(--primary-soft); }
.step-name { font-size: 12.5px; font-weight: 500; } .step-meta { font-size: 11.5px; color: var(--muted); margin-top: -4px; }

/* Timeline */
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--surface-2); }
.tl-item { position: relative; padding: 0 0 18px; }
.tl-item::before { content: ''; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--tl, var(--primary)); }
.tl-head { font-size: 14px; } .tl-head b { font-weight: 600; }
.tl-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; } .field label { font-size: 13px; font-weight: 500; }
.input, .select, .textarea { height: 40px; border-radius: 8px; border: 0; background: var(--surface-2); padding: 0 12px; font-size: 14px; outline: 0; width: 100%; }
.textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 70px; }
.input:focus, .select:focus, .textarea:focus { box-shadow: 0 0 0 2px var(--ring); }
.switch { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 0; flex-shrink: 0; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s; }
.switch.on { background: var(--primary); } .switch.on::after { transform: translateX(16px); }
.row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; } .stack-sm { display: flex; flex-direction: column; gap: 8px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .xs { font-size: 12px; } .fw6 { font-weight: 600; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.divider { height: 1px; background: var(--surface-2); margin: 4px 0; }
.alert { display: flex; gap: 12px; border-radius: 12px; padding: 14px 16px; font-size: 13.5px; }
.alert b { display: block; margin-bottom: 2px; }

/* Workflow builder */
.wf-stage { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-card); cursor: pointer; border: 2px solid transparent; transition: border-color .15s, box-shadow .15s; }
.wf-stage:hover { box-shadow: var(--shadow-raised); }
.wf-stage.sel { border-color: var(--primary); }
.wf-num { width: 28px; height: 28px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.wf-conn { width: 2px; height: 16px; background: var(--surface-3); margin-left: 29px; }
.rule { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.rule code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--surface); padding: 1px 6px; border-radius: 5px; }

/* Checklist */
.drop { border: 2px dashed var(--surface-3); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); font-size: 13.5px; }
.file { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.file-ic { width: 38px; height: 44px; border-radius: 6px; background: var(--danger-soft); color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.check-item { display: flex; gap: 12px; align-items: flex-start; padding: 13px 20px; box-shadow: inset 0 1px 0 var(--surface-2); animation: fade .3s ease-out both; }
.scan { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.scan span { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width 1.6s ease-in-out; }
.ai-card { background: linear-gradient(160deg, color-mix(in srgb, var(--primary) 9%, var(--surface)), var(--surface) 60%); }

/* Map */
.map { width: 100%; height: auto; display: block; border-radius: 12px; }
.pin { cursor: pointer; transition: transform .15s; transform-box: fill-box; transform-origin: center bottom; }
.pin:hover { transform: scale(1.15); }

/* Code */
pre.code { margin: 0; background: #1e1b2e; color: #e9e5f5; border-radius: 10px; padding: 14px 16px; font-size: 12.5px; line-height: 1.6; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
pre.code .k { color: #c4b5fd; } pre.code .s { color: #86efac; } pre.code .c { color: #8b85a3; }

/* Assistant */
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 35; height: 48px; padding: 0 18px 0 14px; border-radius: 999px; border: 0; background: var(--primary); color: #fff; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; box-shadow: var(--shadow-pop); cursor: pointer; }
.fab:hover { background: var(--primary-hover); }
.assistant { position: fixed; right: 24px; bottom: 84px; width: 380px; max-width: calc(100vw - 32px); height: 520px; max-height: calc(100dvh - 140px); z-index: 45; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-pop); display: none; flex-direction: column; overflow: hidden; animation: fade .2s ease-out; }
.assistant.open { display: flex; }
.as-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--surface-2); }
.as-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
.msg.bot { background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }

    if (a === 'close-nav') document.body.classList.remove('nav-open');
    if (a === 'switch') t.classList.toggle('on');
    if (a === 'toast-notif') toast('3 novas notificações: 1 exigência registrada, 1 documento vencido e 1 etapa aprovada.');
    if (a === 'theme') {
      var d = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('hf-theme', d ? 'dark' : 'light'); } catch (e) {}
      renderTop();
    }
    if (a === 'assistant') { state.assistantOpen = !state.assistantOpen; document.getElementById('assistant').classList.toggle('open', state.assistantOpen); }
    if (a === 'run-check') {
      state.check = 'running'; render();
      requestAnimationFrame(function () { requestAnimationFrame(function () { var s = document.getElementById('scanBar'); if (s) s.style.width = '100%'; }); });
      setTimeout(function () { state.check = 'done'; if (route() === 'checklist') render(); }, 1800);
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'empSearch') { state.q = ev.target.value; document.getElementById('empBody').innerHTML = empRows(); }
  });
  document.getElementById('globalSearch').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { state.q = ev.target.value; state.filter = 'todos'; go('empreendimentos'); }
  });
  document.getElementById('asForm').addEventListener('submit', function (ev) {
    ev.preventDefault(); var i = document.getElementById('asInput'); if (!i.value.trim()) return; asAsk(i.value.trim()); i.value = '';
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { document.body.classList.remove('nav-open'); state.assistantOpen = false; document.getElementById('assistant').classList.remove('open'); } });
  window.addEventListener('hashchange', function () { if (route() !== 'checklist' && state.check === 'running') state.check = 'idle'; render(); });

  hydrateIcons(document);
  asInit();
  render();
})();
</script>
</body>
</html>
